<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>pc-manager</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg class="brand-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4.5" y="8" width="25" height="17" rx="3.5" stroke="currentColor" stroke-width="2.6"/>
            <path d="M13 31h8M17 25v6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M31 5.5l1.1 3.4 3.4 1.1-3.4 1.1L31 14.5l-1.1-3.4-3.4-1.1 3.4-1.1z" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">pc-manager</div>
          <div class="brand-sub">AI 系统清理</div>
        </div>
        <button id="adminBadge" class="admin-chip" title="权限模式" aria-haspopup="true"></button>
        <div id="adminMenu" class="admin-menu hidden"></div>
      </div>

      <nav id="tabs" class="sidebar-nav" aria-label="功能导航"></nav>

      <div class="sidebar-foot">
        <div class="sidebar-hint">只读预览 · 确认执行</div>
        <div class="sidebar-hint muted">本地运行，不上传数据</div>
      </div>
    </aside>

    <div class="content">
      <div id="jobBar" class="job-bar hidden" role="button" tabindex="0" aria-label="查看任务详情">
        <div class="job-bar-main">
          <span id="jobBarIcon" class="job-bar-icon"><span class="spinner"></span></span>
          <span id="jobBarTitle" class="job-bar-title">任务</span>
          <span id="jobBarMeta" class="job-bar-meta"></span>
        </div>
        <div class="job-bar-actions">
          <button id="jobBarDetailsBtn" class="icon-btn" title="查看详情" aria-label="查看任务详情">
            <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
          </button>
          <button id="jobBarCloseBtn" class="icon-btn" title="收起" aria-label="收起任务条">
            <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="job-bar-track"><span id="jobBarFill"></span></div>
      </div>

      <main>
        <div id="scanHistoryBar" class="scan-history hidden">
          <span class="scan-history-label">扫描历史</span>
          <div class="scan-picker">
            <button id="scanPicker" class="scan-picker-btn" aria-haspopup="listbox" aria-expanded="false">
              <span class="scan-picker-icon">
                <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 20h20v-4H2v4zm2-3h2v2H4v-2zM2 4v4h20V4H2zm4 3H4V5h2v2zm-4 7h20v-4H2v4zm2-3h2v2H4v-2z"/></svg>
              </span>
              <span id="scanPickerText" class="scan-picker-text">加载中…</span>
              <span class="scan-picker-chevron">
                <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
              </span>
            </button>
            <div id="scanMenu" class="scan-menu hidden" role="listbox" aria-label="扫描结果"></div>
          </div>
          <button id="refreshBtn" class="icon-btn bordered" title="刷新扫描列表" aria-label="刷新扫描列表">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
          <button id="newScanBtn" class="icon-btn primary-icon" title="新建扫描" aria-label="新建扫描">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
        </div>

        <div id="emptyState" class="empty-state hidden"></div>
        <section id="view" class="view"></section>
      </main>
    </div>
  </div>

  <div id="actionbar" class="actionbar hidden">
    <div id="selectionInfo" class="selection-info"></div>
    <div class="actionbar-buttons">
      <button id="clearSelectionBtn" class="btn ghost">清空选择</button>
      <button id="previewBtn" class="btn primary">预览清理</button>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
